; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
[platformio]
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
lib_extra_dirs = libraries

; The fitted ESP32-S3-WROOM-2 uses 32 MB octal flash and octal PSRAM.
board_upload.flash_size = 32MB
board_build.arduino.memory_type = opi_opi
board_build.partitions = large_littlefs_32MB.csv

monitor_speed = 115200
monitor_echo = yes
monitor_eol = LF
monitor_filters = send_on_enter
upload_speed = 921600
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
lib_deps = 
	OneWire
	adafruit/DHT sensor library@^1.4.6
	adafruit/Adafruit Unified Sensor@^1.1.15
	milesburton/DallasTemperature@^3.9.1
	https://github.com/matejpetr/NewPing
	adafruit/Adafruit BMP085 Library@^1.2.4
	adafruit/Adafruit BMP280 Library@^2.6.8
	adafruit/Adafruit TCS34725@^1.4.4
	madhephaestus/ESP32Servo@^3.0.8
	tyhenry/CheapStepper@^0.2.1
	crankyoldgit/IRremoteESP8266@^2.9.0

[env:nodemcu-32s]
platform = espressif32
board = nodemcu-32s
framework = arduino	
lib_extra_dirs = libraries

monitor_speed = 115200
upload_speed = 38400
upload_protocol = esptool
upload_flags =
    --no-stub
board_build.flash_mode = dout
board_build.f_flash = 40000000L
;board_upload.flash_size = 4MB
board_build.partitions = default.csv

build_flags =
    -DCORE_DEBUG_LEVEL=0
lib_deps = 
	OneWire
	adafruit/DHT sensor library@^1.4.6
	adafruit/Adafruit Unified Sensor@^1.1.15
	milesburton/DallasTemperature@^3.9.1
	https://github.com/matejpetr/NewPing
	adafruit/Adafruit BMP085 Library@^1.2.4
	adafruit/Adafruit BMP280 Library@^2.6.8
	adafruit/Adafruit TCS34725@^1.4.4
	madhephaestus/ESP32Servo@^3.0.8
	tyhenry/CheapStepper@^0.2.1
	crankyoldgit/IRremoteESP8266@^2.9.0
